<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diseño de Figuras de Punto de Cruz - Crea hermosos diseños con punto de cruz">
    <title>Punto de Cruz - Diseño de Figuras</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="welcome-header">
            <div class="logo-section">
                <div class="logo-icon">🧵</div>
                <h1 class="main-title">Punto de Cruz</h1>
            </div>
        </header>

        <main class="welcome-content">
            <section class="welcome-section">
                <h2 class="welcome-heading">Bienvenido a tu Diseñador de Punto de Cruz</h2>
                <p class="welcome-text">
                    Crea hermosas figuras con punto de cruz. Diseña, comparte y disfruta del arte del bordado tradicional.
                </p>
                <div class="features">
                    <button class="feature-item" onclick="openGridDesigner()">
                        <span class="feature-icon">✨</span>
                        <p>Diseño de rejilla</p>
                    </button>
                    <div class="feature-item">
                        <span class="feature-icon">🎨</span>
                        <p>Colores vibrantes</p>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📱</span>
                        <p>Acceso en móvil</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="welcome-footer">
            <p>&copy; 2026 Punto de Cruz. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>
        function openGridDesigner() {
            window.location.href = 'grid-designer.html';
        }
    </script>
</body>
</html>
