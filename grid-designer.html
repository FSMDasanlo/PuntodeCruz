<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diseño de Rejilla - Punto de Cruz">
    <title>Diseño de Rejilla - Punto de Cruz</title>
    <link rel="stylesheet" href="css/grid-designer.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <button class="btn-back" onclick="goBack()">← Volver</button>
            <h1 class="app-title">Diseño de Rejilla</h1>
        </header>

        <!-- Main Content -->
        <div class="app-body">
            <!-- Settings Panel -->
            <aside class="settings-panel">
                <h2>Configuración</h2>
                
                <div class="setting-group">
                    <label for="gridWidth">Ancho (cm):</label>
                    <input type="number" id="gridWidth" value="10" min="1" max="100" step="0.5">
                </div>

                <div class="setting-group">
                    <label for="gridHeight">Alto (cm):</label>
                    <input type="number" id="gridHeight" value="10" min="1" max="100" step="0.5">
                </div>

                <div class="setting-group">
                    <label for="cellSize">Sep. rejilla (mm):</label>
                    <input type="number" id="cellSize" value="1" min="0.5" max="10" step="0.5">
                </div>

                <div class="setting-group">
                    <label for="lineColor">Color líneas:</label>
                    <input type="color" id="lineColor" value="#e0e0e0">
                </div>
            </aside>

            <!-- Canvas Area -->
            <main class="canvas-container">
                <!-- Image Gallery (hidden by default) -->
                <div class="image-gallery" id="imageGallery" style="display: none;">
                    <h4>Imágenes disponibles en /img</h4>
                    <div class="gallery-grid" id="galleryGrid">
                        <!-- Images will be loaded here -->
                    </div>
                    <button class="btn-close-gallery" id="btnSelectImages" title="Seleccionar otra imagen">
                        Seleccionar otra imagen
                    </button>
                    <button class="btn-close-gallery" id="btnCloseGallery">Cerrar</button>
                </div>

                <!-- Color Picker Panel -->
                <div class="color-picker-panel">
                    <h3>Color de Pintura</h3>
                    <input type="color" id="paintColor" value="#ff6b6b">
                    <div class="color-preview">
                        <span id="currentColor">Color seleccionado</span>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button class="btn-action" id="btnUndo" title="Deshacer último pintado">
                            ↶
                        </button>
                        <button class="btn-action" id="btnLoadImage" title="Cargar imagen de referencia">
                            🖼️
                        </button>
                        <button class="btn-action" id="btnToggleLayers" title="Intercambiar capas (rejilla/imagen)">
                            ⇅
                        </button>
                        <button class="btn-action" id="btnColorPicker" title="Capturar color de la imagen">
                            🎨
                        </button>
                        <button class="btn-action" id="btnClear" title="Borrar todo el diseño">
                            🗑️
                        </button>
                    </div>
                </div>
                
                <!-- Canvas -->
                <div class="canvas-wrapper">
                    <canvas id="gridCanvas"></canvas>
                    <div class="reference-image-container" id="referenceImageContainer" style="display: none;">
                        <img id="referenceImage" alt="Imagen de referencia" style="display: none;">
                        <button class="btn-remove-image" id="btnRemoveImage" title="Quitar imagen">✕</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="imageFileInput" accept="image/*" style="display: none;" multiple webkitdirectory directory>

    <script src="js/grid-designer.js"></script>
</body>
</html>
